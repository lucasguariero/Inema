        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F8F9FA; }
        .sidebar { background: #FFFFFF; border-right: 1px solid #E5E7EB; }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: #F1F5F9; }
        .sidebar-item.active { background: #E2ECE9; color: #0F4C3A; }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1); }
        .drawer { transition: transform 0.3s ease; }
        .drawer-open { transform: translateX(0); }
        .drawer-closed { transform: translateX(100%); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease; }
        .animate-slide-up { animation: slideUp 0.4s ease; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        /* Bar chart styles */
        .bar-chart-item { display: flex; align-items: center; margin-bottom: 10px; }
        .bar-chart-label { width: 80px; font-size: 12px; color: #64748b; flex-shrink: 0; }
        .bar-chart-bar-container { flex: 1; height: 22px; background: #E2E8F0; border-radius: 4px; overflow: hidden; position: relative; }
        .bar-chart-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
        .bar-chart-value { font-size: 11px; color: white; font-weight: 600; }
        /* Donut chart */
        .donut-chart { width: 180px; height: 180px; border-radius: 50%; position: relative; margin: 0 auto; }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; }

        function renderBarChart(data, maxValue = null) {
            const max = maxValue || Math.max(...data.map(d => d.value));
            return data.map((item, idx) => {
                const width = (item.value / max) * 100;
                return `
                    <div class="bar-chart-item">
                        <div class="bar-chart-label">${item.name}</div>
                        <div class="bar-chart-bar-container">
                            <div class="bar-chart-bar" style="width: ${width}%; background: ${item.color};">
                                <span class="bar-chart-value">${item.value}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDonutChart(data) {
            let cumulative = 0;
            const segments = data.map((item) => {
                const start = cumulative;
                cumulative += item.value;
                const strokeDasharray = `${item.value} ${100 - item.value}`;
                const strokeDashoffset = -start;
                return `
                    <circle cx="90" cy="90" r="70" fill="transparent" stroke="${item.color}" stroke-width="25"
                        stroke-dasharray="${strokeDasharray}" stroke-dashoffset="${strokeDashoffset}"
                        transform="rotate(-90 90 90)" style="cursor: pointer;" onclick="showProcessModal(processosVencidos[0])">
                    </circle>
                `;
            }).join('');

            return `
                <div class="donut-chart">
                    <svg width="180" height="180" viewBox="0 0 180 180">
                        ${segments}
                    </svg>
                    <div class="donut-center">
                        <span class="text-2xl font-bold" style="color: #0F4C3A;">${data.reduce((a, b) => a + b.value, 0)}%</span>
                        <span class="text-xs" style="color: #64748B;">Total</span>
                    </div>
                </div>
            `;
        }

        function renderLineChart(data) {

            const getY = (val) => height - (val / max * height);

            const pointsEntrada = data.map((d, i) => `${i * 100 + 50},${getY(d.entrada)}`).join(' ');
            const pointsSaida = data.map((d, i) => `${i * 100 + 50},${getY(d.saida)}`).join(' ');

                        <polyline points="${pointsSaida}" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="50" cy="${getY(data[0].saida)}" r="5" fill="#10B981"/>

                                    </div>

                                    <!-- Filters Button -->
                                    <button onclick="state.filterDrawerOpen = true; render()" class="flex items-center gap-2 px-4 py-2 bg-white border rounded-lg hover:bg-slate-50 text-slate-700" style="border-color: #CBD5E1;">
                                        ${Icons.Filter()} Filtros
                                        ${activeFiltersCount() > 0 ? `<span class="text-white text-xs px-2 py-0.5 rounded-full" style="background: #0F4C3A;">${activeFiltersCount()}</span>` : ''}
                                    </button>

                                    <!-- Export Button -->
                                    <div class="relative">
                                        <button onclick="state.exportDropdownOpen = !state.exportDropdownOpen; render()" class="flex items-center gap-2 px-4 py-2 bg-white border rounded-lg hover:bg-slate-50 text-slate-700" style="border-color: #CBD5E1;">
                                            ${Icons.Download()} Exportar
                                        </button>
                                        ${state.exportDropdownOpen ? `
                                            <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-slate-200 py-1 z-10" style="position: absolute; right: 0; margin-top: 0.5rem; width: 12rem; border-radius: 0.5rem; border: 1px solid #e2e8f0; padding: 0.25rem 0; z-index: 10;">
                                                <button class="w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2" style="width: 100%; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem;">
                                                    ${Icons.PictureAsPdf()} PDF
                                                </button>
                                                <button class="w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2" style="width: 100%; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem;">
                                                    ${Icons.TableChart()} Excel (XLSX)
                                                </button>
                                                <button class="w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2" style="width: 100%; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem;">
                                                    ${Icons.Code()} CSV
                                                </button>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- KPI Cards -->
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
                            ${kpiData.map(kpi => `
                                <div class="bg-white rounded-2xl p-4 card-hover border shadow-xs" style="border-color: #E2E8F0; border: 1px solid #E2E8F0;">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <p class="text-sm font-medium" style="color: #64748B;">${kpi.label}</p>
                                            <p class="text-2xl font-bold mt-1" style="color: #0F172A;">${kpi.value}</p>
                                        </div>
                                        <div class="flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${
                                            kpi.type === 'green' ? 'bg-green-100 text-green-700' :
                                            kpi.type === 'red' ? 'bg-red-100 text-red-700' :
                                            kpi.type === 'yellow' ? 'bg-yellow-100 text-yellow-700' :
                                            kpi.type === 'gray' ? 'bg-slate-100 text-slate-700' :
                                            'bg-blue-100 text-blue-700'
                                        }">
                                            ${kpi.change > 0 ? Icons.TrendingUp() : Icons.TrendingDown()}
                                            <span>${Math.abs(kpi.change)}%</span>
                                        </div>
                                    </div>
                                    <p class="text-xs mt-2" style="color: #94A3B8;">vs. período anterior</p>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Charts Grid - Row 1 -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <!-- Line Chart -->
                            <div class="bg-white rounded-2xl p-4 border shadow-xs" style="border-color: #E2E8F0; border: 1px solid #E2E8F0;">
                                <h4 class="font-semibold mb-4" style="color: #0F172A;">Entrada x Saída de Processos</h4>
                                ${renderLineChart(lineChartData)}
                            </div>
                            <!-- Donut Chart -->
                            <div class="bg-white rounded-2xl p-4 border shadow-xs" style="border-color: #E2E8F0; border: 1px solid #E2E8F0;">
                                <h4 class="font-semibold mb-4" style="color: #0F172A;">Processos por Status</h4>
                                ${renderDonutChart(donutChartData)}
                                <div class="flex flex-wrap justify-center gap-2 mt-4">
                                    ${donutChartData.map(item => `
                                        <div class="flex items-center gap-1 text-xs">
                                            <div class="w-2 h-2 rounded-full" style="background-color: ${item.color};"></div>
                                            <span style="color: #64748B;">${item.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <!-- Bar Chart - Unidade -->
                            <div class="bg-white rounded-2xl p-4 border shadow-xs" style="border-color: #E2E8F0; border: 1px solid #E2E8F0;">
                                <h4 class="font-semibold mb-4" style="color: #0F172A;">Processos por Unidade</h4>
                                ${renderBarChart(unidadeData)}
                            </div>
                        </div>

                        <!-- Charts Grid - Row 2 -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <!-- Aging -->
                            <div class="bg-white rounded-2xl p-4 border shadow-xs" style="border-color: #E2E8F0; border: 1px solid #E2E8F0;">
                                <h4 class="font-semibold mb-4" style="color: #0F172A;">Aging do Estoque (tempo de permanência)</h4>
                                ${renderBarChart(agingData)}
                            </div>
                            <!-- Tempo Médio -->
                            <div class="bg-white rounded-2xl p-4 border shadow-xs" style="border-color: #E2E8F0; border: 1px solid #E2E8F0;">
                                <h4 class="font-semibold mb-4" style="color: #0F172A;">Tempo Médio de Análise (dias)</h4>
                                ${renderBarChart(tempoAnaliseData, 25)}
                            </div>
                            <!-- Vencidos por Unidade -->
                            <div class="bg-white rounded-2xl p-4 border shadow-xs" style="border-color: #E2E8F0; border: 1px solid #E2E8F0;">
                                <h4 class="font-semibold mb-4" style="color: #0F172A;">Processos Vencidos por Unidade</h4>
                                ${renderBarChart(vencidosUnidadeData, 100)}
                            </div>
                        </div>

                        <!-- Table -->
                        <div class="mt-4">
                            <div class="bg-white rounded-2xl border shadow-xs overflow-hidden" style="border-color: #E2E8F0; border: 1px solid #E2E8F0;">
                                <div class="p-4 border-b flex items-center justify-between" style="border-color: #E2E8F0;">
                                    <h4 class="font-semibold flex items-center gap-2" style="color: #0F172A;">
                                        ${Icons.Warning()} Processos Vencidos (Top 5)
                                    </h4>
                                    <button class="text-sm hover:underline" style="color: #0F4C3A;">Ver todos</button>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-sm">
                                        <thead style="background: #F8FAFC;">
                                            <tr>
                                                <th class="text-left p-3 font-medium" style="color: #64748B;">Processo</th>
                                                <th class="text-left p-3 font-medium" style="color: #64748B;">Tipo</th>
                                                <th class="text-left p-3 font-medium" style="color: #64748B;">Unidade</th>
                                                <th class="text-left p-3 font-medium" style="color: #64748B;">Etapa</th>
                                                <th class="text-left p-3 font-medium" style="color: #64748B;">Responsável</th>
                                                <th class="text-left p-3 font-medium" style="color: #64748B;">Vencido há</th>
                                                <th class="text-center p-3 font-medium" style="color: #64748B;">Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${processosVencidos.map((proc, idx) => `
                                                <tr class="border-t" style="border-color: #F1F5F9;">
                                                    <td class="p-3 font-medium" style="color: #0F4C3A;">${proc.processo}</td>
                                                    <td class="p-3" style="color: #64748B;">${proc.tipo}</td>
                                                    <td class="p-3" style="color: #64748B;">${proc.unidade}</td>
                                                    <td class="p-3" style="color: #64748B;">${proc.etapa}</td>
                                                    <td class="p-3" style="color: #64748B;">${proc.responsavel}</td>
                                                    <td class="p-3">
                                                        <span class="px-2 py-1 rounded-full text-xs font-medium border" style="background: #FEF2F2; color: #DC2626; border-color: #FECACA;">
                                                            ${proc.diasVencido} dias
                                                        </span>
                                                    </td>
                                                    <td class="p-3 text-center">
                                                        <button onclick="showProcessModal(processosVencidos[${idx}])" class="px-3 py-1.5 text-white text-xs rounded-lg transition-colors flex items-center gap-1 mx-auto" style="background: #0F4C3A;" onmouseover="this.style.background='#134E39'" onmouseout="this.style.background='#0F4C3A'">
                                                            ${Icons.Visibility()} Ver Detalhes
                                                        </button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>

                <!-- Filter Drawer -->
                ${state.filterDrawerOpen ? `
                    <div class="drawer fixed inset-y-0 right-0 w-96 bg-white shadow-2xl z-50" style="position: fixed; top: 0; right: 0; bottom: 0; width: 24rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); z-index: 50;">
                        <div class="h-full flex flex-col">
                            <div class="flex items-center justify-between p-4 border-b" style="border-color: #E2E8F0;">
                                <div class="flex items-center gap-2">
                                    ${Icons.Filter()}
                                    <h3 class="font-semibold" style="color: #0F172A;">Filtros Avançados</h3>
                                    ${activeFiltersCount() > 0 ? `<span class="text-white text-xs px-2 py-0.5 rounded-full" style="background: #0F4C3A;">${activeFiltersCount()}</span>` : ''}
                                </div>
                                <button onclick="closeDrawer()" class="p-1 hover:bg-slate-100 rounded">
                                    ${Icons.Close()}
                                </button>
                            </div>
                            <div class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin" style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem;">
                                ${Object.entries(filtrosOptions).map(([key, options]) => `
                                    <div>
                                        <label class="block text-sm font-medium mb-2" style="color: #334155;">
                                            ${key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}
                                        </label>
                                        <div class="flex flex-wrap gap-2">
                                            ${options.map(opt => `
                                                <button onclick="toggleFilter('${key}', '${opt}')" class="px-3 py-1.5 text-xs rounded-full border transition-colors" style="${state.filters[key].includes(opt) ? 'background: #0F4C3A; color: white; border-color: #0F4C3A;' : 'background: white; color: #475569; border-color: #CBD5E1;'}">
                                                    ${opt}
                                                </button>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="p-4 border-t flex gap-2" style="border-color: #E2E8F0;">
                                <button onclick="state.filters = {tipoProcesso: [], status: [], etapa: [], unidade: [], municipio: [], responsavel: [], situacaoPrazo: [], modalidadeAto: []}; render();" class="flex-1 px-4 py-2 border rounded-lg hover:bg-slate-50" style="border-color: #CBD5E1; color: #475569;">
                                    Limpar
                                </button>
                                <button onclick="closeDrawer()" class="flex-1 px-4 py-2 text-white rounded-lg" style="background: #0F4C3A;">
                                    Aplicar
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="fixed inset-0 bg-black/30 z-40" onclick="closeDrawer()" style="position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40;"></div>
                ` : ''}

                <!-- Process Detail Modal -->
                ${state.selectedProcess ? `
                    <div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay animate-fade-in" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50;">
                        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden animate-slide-up" style="background: white; border-radius: 0.75rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); max-width: 42rem; max-height: 90vh; overflow: auto;">
                            <div class="flex items-center justify-between p-4 border-b" style="background: #F8FAFC; border-color: #E2E8F0;">
                                <h3 class="font-semibold" style="color: #0F172A;">Detalhamento - ${state.selectedProcess.processo}</h3>
                                <button onclick="closeModal()" class="p-1 hover:bg-slate-200 rounded-lg">
                                    ${Icons.Close()}
                                </button>
                            </div>
                            <div class="p-4 scrollbar-thin" style="padding: 1rem;">
                                <div class="space-y-6">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div class="rounded-lg p-4" style="background: #F8FAFC;">
                                            <p class="text-xs uppercase tracking-wide" style="color: #64748B;">Tipo de Processo</p>
                                            <p class="font-medium mt-1" style="color: #0F172A;">${state.selectedProcess.tipo}</p>
                                        </div>
                                        <div class="rounded-lg p-4" style="background: #F8FAFC;">
                                            <p class="text-xs uppercase tracking-wide" style="color: #64748B;">Unidade</p>
                                            <p class="font-medium mt-1" style="color: #0F172A;">${state.selectedProcess.unidade}</p>
                                        </div>
                                        <div class="rounded-lg p-4" style="background: #F8FAFC;">
                                            <p class="text-xs uppercase tracking-wide" style="color: #64748B;">Etapa Atual</p>
                                            <p class="font-medium mt-1" style="color: #0F172A;">${state.selectedProcess.etapa}</p>
                                        </div>
                                        <div class="rounded-lg p-4" style="background: #F8FAFC;">
                                            <p class="text-xs uppercase tracking-wide" style="color: #64748B;">Responsável</p>
                                            <p class="font-medium mt-1" style="color: #0F172A;">${state.selectedProcess.responsavel}</p>
                                        </div>
                                        <div class="rounded-lg p-4 col-span-2" style="background: #FEF2F2; grid-column: span 2;">
                                            <p class="text-xs uppercase tracking-wide" style="color: #DC2626;">Tempo Vencido</p>
                                            <p class="font-bold text-2xl mt-1" style="color: #DC2626;">${state.selectedProcess.diasVencido} dias</p>
                                        </div>
                                    </div>

                                    <div>
                                        <h4 class="font-semibold mb-3 flex items-center gap-2" style="color: #0F172A;">
                                            ${Icons.Schedule()} Histórico de Tramitação
                                        </h4>
                                        <div class="rounded-lg border overflow-hidden" style="border-color: #E2E8F0;">
                                            <table class="w-full text-sm">
                                                <thead style="background: #F8FAFC;">
                                                    <tr>
                                                        <th class="text-left p-3 font-medium" style="color: #64748B;">Data</th>
                                                        <th class="text-left p-3 font-medium" style="color: #64748B;">Etapa</th>
                                                        <th class="text-left p-3 font-medium" style="color: #64748B;">Ação</th>
                                                        <th class="text-left p-3 font-medium" style="color: #64748B;">Usuário</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    ${historicoTramitacao.map(item => `
                                                        <tr class="border-t" style="border-color: #F1F5F9;">
                                                            <td class="p-3" style="color: #64748B;">${item.data} ${item.hora}</td>
                                                            <td class="p-3" style="color: #0F172A;">${item.etapa}</td>
                                                            <td class="p-3" style="color: #64748B;">${item.acao}</td>
                                                            <td class="p-3" style="color: #64748B;">${item.usuario}</td>
                                                        </tr>
                                                    `).join('')}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div class="flex gap-2">
                                        <button class="flex-1 px-4 py-2 text-white rounded-lg flex items-center justify-center gap-2 transition-colors" style="background: #0F4C3A;" onmouseover="this.style.background='#134E39'" onmouseout="this.style.background='#0F4C3A'">
                                            ${Icons.Visibility()} Ver Processo Completo
                                        </button>
                                        <button class="px-4 py-2 border rounded-lg flex items-center gap-2 hover:bg-slate-50" style="border-color: #CBD5E1; color: #475569;">
                                            ${Icons.FileCopy()} Copy
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        // Initial render
        render();
    </script>
</body>
</html>
