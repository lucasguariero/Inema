            theme: {

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .sidebar { background: linear-gradient(180deg, #022c4a 0%, #0a3d5c 100%); }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1); }
        .drawer { transition: transform 0.3s ease; }
        .drawer-open { transform: translateX(0); }
        .drawer-closed { transform: translateX(100%); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .kpi-card { border-left: 4px solid; }
        .kpi-card.blue { border-color: #004b87; }
        .kpi-card.green { border-color: #059669; }
        .kpi-card.red { border-color: #dc2626; }
        .kpi-card.orange { border-color: #d97706; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease; }
        .animate-slide-up { animation: slideUp 0.4s ease; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Simple bar chart styles */
        .bar-chart-item { display: flex; align-items: center; margin-bottom: 12px; }
        .bar-chart-label { width: 80px; font-size: 12px; color: #64748b; flex-shrink: 0; }
        .bar-chart-bar-container { flex: 1; height: 24px; background: #e2e8f0; border-radius: 4px; overflow: hidden; position: relative; }
        .bar-chart-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
        .bar-chart-value { font-size: 11px; color: white; font-weight: 600; }
        /* Donut chart */
        .donut-chart { width: 180px; height: 180px; border-radius: 50%; position: relative; margin: 0 auto; }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>

            const idx = state.filters[category].indexOf(value);
            if (idx > -1) {

            }
            render();

        function activeFiltersCount() {

        function renderBarChart(data, colors, maxValue = null) {
            const max = maxValue || Math.max(...data.map(d => d.value));
            return data.map((item, idx) => {
                const width = (item.value / max) * 100;
                const color = item.color || (colors ? colors[idx % colors.length] : '#004b87');
                return `
                    <div class="bar-chart-item">
                        <div class="bar-chart-label">${item.name}</div>
                        <div class="bar-chart-bar-container">
                            <div class="bar-chart-bar" style="width: ${width}%; background: ${color};">
                                <span class="bar-chart-value">${item.value}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDonutChart(data) {
            let cumulative = 0;
            const segments = data.map((item, idx) => {
                const start = cumulative;
                cumulative += item.value;
                const strokeDasharray = `${item.value} ${100 - item.value}`;
                const strokeDashoffset = -start;
                cumulative = cumulative;
                return `
                    <circle cx="90" cy="90" r="70" fill="transparent" stroke="${item.color}" stroke-width="25"
                        stroke-dasharray="${strokeDasharray}" stroke-dashoffset="${strokeDashoffset}"
                        transform="rotate(-90 90 90)" style="cursor: pointer;" onclick="showProcessModal(processosVencidos[0])">
                    </circle>
                `;
            }).join('');

            return `
                <div class="donut-chart">
                    <svg width="180" height="180" viewBox="0 0 180 180">
                        ${segments}
                    </svg>
                    <div class="donut-center">
                        <span class="text-2xl font-bold text-slate-800">${data.reduce((a, b) => a + b.value, 0)}%</span>
                        <span class="text-xs text-slate-500">Total</span>
                    </div>
                </div>
            `;
        }

        function renderLineChart(data) {
            const max = Math.max(...data.flatMap(d => [d.entrada, d.saida])) * 1.1;

            const getY = (val) => height - (val / max * height);

            const pointsEntrada = data.map((d, i) => `${i * 100 + 50},${getY(d.entrada)}`).join(' ');
            const pointsSaida = data.map((d, i) => `${i * 100 + 50},${getY(d.saida)}`).join(' ');

            return `

                            <span class="text-xs text-slate-600">Saída</span>
                        </div>
                    </div>
                </div>
            `;

                                                        ${Icons.PictureAsPdf()} PDF
                                                    </button>
                                                    <button class="w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2" style="width: 100%; padding: 0.5rem 1rem; text-align: left; display: flex; align-items: center; gap: 0.5rem;">
                                                        ${Icons.TableChart()} Excel (XLSX)
                                                    </button>
                                                    <button class="w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2" style="width: 100%; padding: 0.5rem 1rem; text-align: left; display: flex; align-items: center; gap: 0.5rem;">
                                                        ${Icons.Code()} CSV
                                                    </button>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- KPI Cards -->
                            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
                                ${kpiData.map(kpi => `
                                    <div class="kpi-card kpi-card.${kpi.type} bg-white rounded-xl p-4 card-hover border border-slate-200 shadow-sm" style="border-left: 4px solid ${kpi.type === 'blue' ? '#004b87' : kpi.type === 'green' ? '#059669' : kpi.type === 'red' ? '#dc2626' : '#d97706'};">
                                        <div class="flex items-start justify-between">
                                            <div>
                                                <p class="text-sm text-slate-500 font-medium">${kpi.label}</p>
                                                <p class="text-2xl font-bold mt-1 ${kpi.type === 'red' ? 'text-inema-danger' : 'text-slate-800'}">${kpi.value}</p>
                                            </div>
                                            <div class="flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium ${kpi.type === 'green' ? 'bg-green-50 text-green-700' : kpi.type === 'red' ? 'bg-red-50 text-red-700' : kpi.type === 'orange' ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'}">
                                                ${kpi.change > 0 ? Icons.TrendingUp() : Icons.TrendingDown()}
                                                <span>${Math.abs(kpi.change)}%</span>
                                            </div>
                                        </div>
                                        <p class="text-xs text-slate-400 mt-2">vs. período anterior</p>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Charts Grid - Row 1 -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                <!-- Line Chart -->
                                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                    <h4 class="font-semibold text-slate-800 mb-4">Entrada x Saída de Processos</h4>
                                    ${renderLineChart(lineChartData)}
                                </div>
                                <!-- Donut Chart -->
                                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                    <h4 class="font-semibold text-slate-800 mb-4">Processos por Status</h4>
                                    ${renderDonutChart(donutChartData)}
                                    <div class="flex flex-wrap justify-center gap-2 mt-4">
                                        ${donutChartData.map(item => `
                                            <div class="flex items-center gap-1 text-xs">
                                                <div class="w-2 h-2 rounded-full" style="background-color: ${item.color};"></div>
                                                <span class="text-slate-600">${item.name}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                <!-- Bar Chart - Unidade -->
                                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                    <h4 class="font-semibold text-slate-800 mb-4">Processos por Unidade</h4>
                                    ${renderBarChart(unidadeData, ['#004b87', '#0284c7', '#0369a1', '#075985', '#0c4a6e', '#082f49'])}
                                </div>
                            </div>

                            <!-- Charts Grid - Row 2 -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                <!-- Aging -->
                                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                    <h4 class="font-semibold text-slate-800 mb-4">Aging do Estoque (tempo de permanência)</h4>
                                    ${renderBarChart(agingData)}
                                </div>
                                <!-- Tempo Médio -->
                                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                    <h4 class="font-semibold text-slate-800 mb-4">Tempo Médio de Análise (dias)</h4>
                                    ${renderBarChart(tempoAnaliseData, ['#059669', '#10b981', '#34d399', '#6ee7b7', '#a7f3d0'], 25)}
                                </div>
                                <!-- Vencidos por Unidade -->
                                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                    <h4 class="font-semibold text-slate-800 mb-4">Processos Vencidos por Unidade</h4>
                                    ${renderBarChart(vencidosUnidadeData, ['#dc2626', '#ef4444', '#f87171', '#fca5a5', '#fecaca'], 100)}
                                </div>
                            </div>

                            <!-- Table -->
                            <div class="mt-4">
                                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div class="p-4 border-b border-slate-200 flex items-center justify-between">
                                        <h4 class="font-semibold text-slate-800 flex items-center gap-2">
                                            ${Icons.Warning()} Processos Vencidos (Top 5)
                                        </h4>
                                        <button class="text-sm text-inema-primary hover:underline">Ver todos</button>
                                    </div>
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-sm">
                                            <thead class="bg-slate-50">
                                                <tr>
                                                    <th class="text-left p-3 font-medium text-slate-600">Processo</th>
                                                    <th class="text-left p-3 font-medium text-slate-600">Tipo</th>
                                                    <th class="text-left p-3 font-medium text-slate-600">Unidade</th>
                                                    <th class="text-left p-3 font-medium text-slate-600">Etapa</th>
                                                    <th class="text-left p-3 font-medium text-slate-600">Responsável</th>
                                                    <th class="text-left p-3 font-medium text-slate-600">Vencido há</th>
                                                    <th class="text-center p-3 font-medium text-slate-600">Ação</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${processosVencidos.map((proc, idx) => `
                                                    <tr class="border-t border-slate-100 hover:bg-slate-50">
                                                        <td class="p-3 font-medium text-inema-primary">${proc.processo}</td>
                                                        <td class="p-3 text-slate-600">${proc.tipo}</td>
                                                        <td class="p-3 text-slate-600">${proc.unidade}</td>
                                                        <td class="p-3 text-slate-600">${proc.etapa}</td>
                                                        <td class="p-3 text-slate-600">${proc.responsavel}</td>
                                                        <td class="p-3">
                                                            <span class="px-2 py-1 bg-red-50 text-red-700 rounded-full text-xs font-medium">
                                                                ${proc.diasVencido} dias
                                                            </span>
                                                        </td>
                                                        <td class="p-3 text-center">
                                                            <button onclick="showProcessModal(processosVencidos[${idx}])" class="px-3 py-1.5 bg-inema-primary text-white text-xs rounded-lg hover:bg-inema-dark flex items-center gap-1 mx-auto" style="display: inline-flex; align-items: center; gap: 0.25rem;">
                                                                ${Icons.Visibility()} Ver Detalhes
                                                            </button>
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    <!-- Filter Drawer -->
                    ${state.filterDrawerOpen ? `
                        <div class="drawer fixed inset-y-0 right-0 w-96 bg-white shadow-2xl z-50" style="position: fixed; top: 0; right: 0; bottom: 0; width: 24rem; background: white; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); z-index: 50;">
                            <div class="h-full flex flex-col">
                                <div class="flex items-center justify-between p-4 border-b border-slate-200">
                                    <div class="flex items-center gap-2">
                                        ${Icons.Filter()}
                                        <h3 class="font-semibold text-slate-800">Filtros Avançados</h3>
                                        ${activeFiltersCount() > 0 ? `<span class="bg-inema-primary text-white text-xs px-2 py-0.5 rounded-full">${activeFiltersCount()}</span>` : ''}
                                    </div>
                                    <button onclick="closeDrawer()" class="p-1 hover:bg-slate-100 rounded">
                                        ${Icons.Close()}
                                    </button>
                                </div>
                                <div class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin" style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem;">
                                    ${Object.entries(filtrosOptions).map(([key, options]) => `
                                        <div>
                                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                                ${key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}
                                            </label>
                                            <div class="flex flex-wrap gap-2">
                                                ${options.map(opt => `
                                                    <button onclick="toggleFilter('${key}', '${opt}')" class="px-3 py-1.5 text-xs rounded-full border transition-colors ${state.filters[key].includes(opt) ? 'bg-inema-primary text-white border-inema-primary' : 'bg-white text-slate-600 border-slate-300 hover:border-inema-primary'}" style="padding: 0.375rem 0.75rem; font-size: 0.75rem; border-radius: 9999px; border: 1px solid ${state.filters[key].includes(opt) ? '#004b87' : '#cbd5e1'}; background: ${state.filters[key].includes(opt) ? '#004b87' : 'white'}; color: ${state.filters[key].includes(opt) ? 'white' : '#475569'};">
                                                        ${opt}
                                                    </button>
                                                `).join('')}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="p-4 border-t border-slate-200 flex gap-2">
                                    <button onclick="state.filters = {tipoProcesso: [], status: [], etapa: [], unidade: [], municipio: [], responsavel: [], situacaoPrazo: [], modalidadeAto: []}; render();" class="flex-1 px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50" style="flex: 1; padding: 0.5rem 1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;">
                                        Limpar
                                    </button>
                                    <button onclick="closeDrawer()" class="flex-1 px-4 py-2 bg-inema-primary text-white rounded-lg hover:bg-inema-dark" style="flex: 1; padding: 0.5rem 1rem; background: #004b87; color: white; border-radius: 0.5rem;">
                                        Aplicar
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="fixed inset-0 bg-black/30 z-40" onclick="closeDrawer()" style="position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40;"></div>
                    ` : ''}

                    <!-- Process Detail Modal -->
                    ${state.selectedProcess ? `
                        <div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay animate-fade-in" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50;">
                            <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden animate-slide-up" style="background: white; border-radius: 0.75rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); max-width: 42rem; max-height: 90vh; overflow: auto;">
                                <div class="flex items-center justify-between p-4 border-b border-slate-200 bg-slate-50">
                                    <h3 class="font-semibold text-slate-800">Detalhamento - ${state.selectedProcess.processo}</h3>
                                    <button onclick="closeModal()" class="p-1 hover:bg-slate-200 rounded-lg">
                                        ${Icons.Close()}
                                    </button>
                                </div>
                                <div class="overflow-y-auto max-h-[calc(90vh-80px)] p-4 scrollbar-thin" style="padding: 1rem;">
                                    <div class="space-y-6">
                                        <div class="grid grid-cols-2 gap-4">
                                            <div class="bg-slate-50 rounded-lg p-4">
                                                <p class="text-xs text-slate-500 uppercase tracking-wide">Tipo de Processo</p>
                                                <p class="font-medium text-slate-800 mt-1">${state.selectedProcess.tipo}</p>
                                            </div>
                                            <div class="bg-slate-50 rounded-lg p-4">
                                                <p class="text-xs text-slate-500 uppercase tracking-wide">Unidade</p>
                                                <p class="font-medium text-slate-800 mt-1">${state.selectedProcess.unidade}</p>
                                            </div>
                                            <div class="bg-slate-50 rounded-lg p-4">
                                                <p class="text-xs text-slate-500 uppercase tracking-wide">Etapa Atual</p>
                                                <p class="font-medium text-slate-800 mt-1">${state.selectedProcess.etapa}</p>
                                            </div>
                                            <div class="bg-slate-50 rounded-lg p-4">
                                                <p class="text-xs text-slate-500 uppercase tracking-wide">Responsável</p>
                                                <p class="font-medium text-slate-800 mt-1">${state.selectedProcess.responsavel}</p>
                                            </div>
                                            <div class="bg-red-50 rounded-lg p-4 col-span-2" style="grid-column: span 2;">
                                                <p class="text-xs text-red-600 uppercase tracking-wide">Tempo Vencido</p>
                                                <p class="font-bold text-red-700 text-2xl mt-1">${state.selectedProcess.diasVencido} dias</p>
                                            </div>
                                        </div>

                                        <div>
                                            <h4 class="font-semibold text-slate-800 mb-3 flex items-center gap-2">
                                                ${Icons.Schedule()} Histórico de Tramitação
                                            </h4>
                                            <div class="border border-slate-200 rounded-lg overflow-hidden">
                                                <table class="w-full text-sm">
                                                    <thead class="bg-slate-50">
                                                        <tr>
                                                            <th class="text-left p-3 font-medium text-slate-600">Data</th>
                                                            <th class="text-left p-3 font-medium text-slate-600">Etapa</th>
                                                            <th class="text-left p-3 font-medium text-slate-600">Ação</th>
                                                            <th class="text-left p-3 font-medium text-slate-600">Usuário</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        ${historicoTramitacao.map(item => `
                                                            <tr class="border-t border-slate-100">
                                                                <td class="p-3 text-slate-600">${item.data} ${item.hora}</td>
                                                                <td class="p-3 text-slate-800">${item.etapa}</td>
                                                                <td class="p-3 text-slate-600">${item.acao}</td>
                                                                <td class="p-3 text-slate-600">${item.usuario}</td>
                                                            </tr>
                                                        `).join('')}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div class="flex gap-2">
                                            <button class="flex-1 px-4 py-2 bg-inema-primary text-white rounded-lg hover:bg-inema-dark flex items-center justify-center gap-2" style="flex: 1; padding: 0.5rem 1rem; background: #004b87; color: white; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                                                ${Icons.Visibility()} Ver Processo Completo
                                            </button>
                                            <button class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 flex items-center gap-2" style="padding: 0.5rem 1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                                                ${Icons.FileCopy()} Copy
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Initial render
        render();
    </script>
</body>
</html>
