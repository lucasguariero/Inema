<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const p = new URLSearchParams(window.location.search);
        const hasRoute = p.get('rota') || p.get('route') || p.get('r');
        const isNewLayout = p.get('layout') === 'novo' || window.location.pathname.startsWith('/conceito') || window.location.pathname.startsWith('/proposta');
        if (!hasRoute && !isNewLayout && (window.location.pathname === '/' || window.location.pathname === '/index.html')) {
          window.location.replace('/relatorios-antigo.html');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INEMA - Portal Integrado de Fiscalização e Regulação Ambiental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
